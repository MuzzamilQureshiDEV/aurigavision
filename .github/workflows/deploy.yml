# Builds the site and publishes it to GitHub Pages on every push to main.
# Live URL: https://muzzamilqureshidev.github.io/aurigavision/
#
# WHY THE gh-pages BRANCH:
# `actions/configure-pages` with `enablement: true` has to create the Pages
# site when one does not exist yet, and the workflow token is not always
# permitted to do that — when it fails, every later step is skipped and the
# deploy silently produces nothing. Pushing a gh-pages branch enables Pages
# automatically and needs no repository settings change.
#
# The build runs with a /aurigavision/ base path so every asset resolves under
# the project sub-path; src/lib/asset.js does the same for runtime image paths.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:gh

      # Stops Pages from running the output through Jekyll, which would drop
      # any file or folder beginning with an underscore.
      - run: touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
