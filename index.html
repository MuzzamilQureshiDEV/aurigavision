<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AurigaVision AG | Recruitment &amp; Executive Search für die Healthcare Industrie</title>

      name="description"

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0E1D33" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:site_name" content="AurigaVision AG" />
    <meta property="og:title" content="AurigaVision AG | Recruitment & Executive Search für Healthcare" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Fonts: preconnect first so the handshake overlaps with HTML parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data helps the brand surface correctly in search results.
         CLIENT: update sameAs/telephone once the official profiles are confirmed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "AurigaVision AG",
        "description": "Recruitment & Executive Search für die Healthcare Industrie — Pharma, BioTech, MedTech.",
        "url": "https://www.aurigavision.ch/",
        "email": "info@aurigavision.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Baarerstrasse 139",
          "postalCode": "6300",
          "addressLocality": "Zug",
          "addressCountry": "CH"
        },
        "areaServed": "CH",
        "knowsAbout": ["Pharma", "BioTech", "MedTech", "Executive Search", "Recruitment"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
